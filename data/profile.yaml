timeline:
  - year: "2019"
    title: 入坑图形学
    text: 第一次写光线追踪，看到像素一个个亮起来的时候，决定了方向。从 OpenGL 三角形开始，一路折腾到 PBR。
  - year: "2021"
    title: 渲染狂热期
    text: 写了离线渲染器、实时渲染器、体素引擎……能用光栅化解决的问题绝不用别的。坚信手写 Shader 才是正道。
  - year: "2022"
    title: 工业级渲染
    text: 第一次接触生产级渲染管线。才发现学校写的 toy renderer 和真正要跑在几亿设备上的东西，完全不是一回事。
  - year: "2023"
    title: NeRF 冲击
    text: 3DGS 论文出来的那天，意识到神经网络正在吃掉传统渲染的地盘。开始认真学 ML，从怀疑到「这东西真的能用」。
  - year: "2024"
    title: Neural Rendering
    text: 读研方向选了可微渲染。两个世界开始融合——用梯度下降做渲染，用渲染知识设计网络。这才是我想做的事。
  - year: "2025"
    title: Rendering is Dead?
    text: AI 生成的画面已经能骗过大多数人的眼睛。传统渲染不会消失，但规则变了。与其对抗，不如站在交叉点上。

