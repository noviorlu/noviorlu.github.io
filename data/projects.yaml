# /projects/ 页（layouts/projects/list.html）和首页「精选项目」的数据。
#
# 每个项目一条：
#   id        唯一名字
#   title     标题
#   kind      小标签（工具 / 交互页面 / 渲染器 …）
#   group     属于哪一组（见下面 groups 的 id）
#   featured  出现在首页和 /projects/ 顶部的顺序（不写 = 不精选）
#   summary   一句话
#   tags      技术栈
#   url       站内详情页或在线演示（卡片整体点进去的地方）；没有就不写
#   links     其他链接：[{label, url}]
#   cover     精选卡片的封面：assets/ 下的图片路径，或 "svg:<名字>"（layouts/partials/nv/cover.html 里画的）

groups:
  - id: tools
    title: 工具与交互页面
    blurb: 自己要用、顺手做成网页的东西。
  - id: rendering
    title: 渲染与图形
    blurb: 从 Whitted 光线追踪到可微渲染的一路练习。
  - id: systems
    title: 系统、游戏与课程项目
    blurb: 本科与研究生阶段的课程项目和小作品。

items:
  - id: flops
    title: Transformer 算力与显存计算器
    kind: 交互页面
    group: tools
    featured: 2
    summary: 把一个 Transformer LM 的参数量、前向 FLOPs、训练一步的显存和时间从头数一遍——每一项先写符号公式再代入配置，附可缩放的架构图。CS336 笔记 §5.4 的配套页面。
    tags: [Transformer, FLOPs, 显存, CS336]
    url: /projects/flops/
    cover: img/projects/flops.jpg

