# /projects/codestrata/ 页（layouts/projects/codestrata.html）的数据。
#
# 加一个扫描过的仓库：
#   1. 在那个仓库里导出（必须带 --public；--out 指向本仓库 static/ 下的新目录，目录名 = slug）：
#        codestrata graph . --link github --public --hot <run>@<阶段> [--hot …] \
#            --out ~/projects/noviorlu.github.io/static/projects/codestrata/<slug>
#      导出目录里有 .codestrata-site 标记，以后再导出到同一目录会原地替换。
#      不要在这个目录里放别的文件，也不要改导出的文件。
#   2. 在下面 repos 里加一条，slug 和目录名一致。页面上的「选择仓库」卡片就会多一张，
#      链到 /projects/codestrata/<slug>/。

# codestrata 自己的源码仓库地址。仓库公开后填上，页面上会出现「源码」按钮；空着就不显示。
source: ""

repos:
  - slug: vllm-omni                        # = static/projects/codestrata/vllm-omni/
    name: vllm-omni
    github: vllm-project/vllm-omni          # owner/name
    commit: a8576ccb725c4e21cd13c3eb5f9a546b21149d2b
    exported: 2026-09-28
    language: Python
    shot: img/projects/codestrata-vllm-omni.jpg   # 可选：assets/ 下的截图，第一个仓库的会放在页面顶部
    summary: vLLM 的全模态推理与服务框架：把 vLLM 从文本自回归扩展到图像、音频、视频的输入输出和 DiT 这类非自回归模型，用分 stage 的流水线编排异构模型。
    stats:
      - { label: 文件, value: "1,608" }
      - { label: 图上模块, value: "58" }
      - { label: 录制的运行, value: "2" }
    runs:
      - id: 20260928-101750-run_single_prompt
        case: run_single_prompt
        date: 2026-09-28
        mode: 离线推理
        default: true
        what: examples/offline_inference/minicpmo/run_single_prompt.sh —— MiniCPM-o 4.5 离线跑一条提示，按函数切成 start / serving / shutdown 三段，页面默认叠的是 serving 段。
      - id: 20260927-153410-minicpmo-duplex
        case: minicpmo-duplex
        date: 2026-09-27
        mode: 在线服务
        what: vllm-omni serve 起 MiniCPM-o 4.5，再用 realtime_duplex_demo.py 发一段实时全双工语音对话；只看服务就绪之后的 serving 段。
    hardware: 单卡 RTX 5090
