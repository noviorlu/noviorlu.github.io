{{- /* Wires every nv/share.html instance on the page: native share sheet, copy link,
       anonymous reactions (Abacus counters, clicking again undoes), and the comment count
       from giscus's public API. */ -}}
<script>
  (() => {
    const url = {{ .Permalink }};
    const title = {{ .Title }};
    document.querySelectorAll('[data-nv-share="native"]').forEach((btn) => {
      if (!navigator.share) return;
      btn.hidden = false;
      btn.addEventListener("click", () => navigator.share({ title, url }).catch(() => {}));
    });
    document.querySelectorAll('[data-nv-share="copy"]').forEach((btn) => {
      btn.addEventListener("click", async () => {
        let ok = true;
        try { await navigator.clipboard.writeText(url); } catch { ok = false; }
        btn.dataset.state = ok ? "done" : "failed";
        btn.title = ok ? "已复制" : "复制失败";
        setTimeout(() => { delete btn.dataset.state; btn.title = "复制链接"; }, 1600);
      });
    });

    // Reactions. Abacus counters only go up, so each reaction has two:
    //   <slug>.<key>       clicks      e.g. noviorlu.github.io/blog.some-post.doge
    //   <slug>.<key>.undo  undos
    // and the shown count is clicks − undos. This browser remembers what it reacted to.
    const { slug } = nvAbacus;
    const storeKey = "nv-reacted:" + slug;
    const reacted = new Set();
    try { JSON.parse(localStorage.getItem(storeKey) || "[]").forEach((k) => reacted.add(k)); } catch {}
    const save = () => { try { localStorage.setItem(storeKey, JSON.stringify([...reacted])); } catch {} };
    const get = (key, undo) => nvAbacus.get(key + (undo ? ".undo" : ""));
    const hit = (key, undo) => nvAbacus.hit(key + (undo ? ".undo" : ""));

    const counts = {}; // key -> { add, undo }, undefined until loaded
    const paint = (key) => {
      const c = counts[key];
      const n = c ? Math.max(c.add - c.undo, 0) : "";
      document.querySelectorAll(`[data-nv-react="${key}"]`).forEach((btn) => {
        btn.querySelector("[data-nv-react-count]").textContent = n || "";
        btn.classList.toggle("has-count", n > 0);
        btn.setAttribute("aria-pressed", reacted.has(key));
      });
    };
    const keys = [...new Set([...document.querySelectorAll("[data-nv-react]")].map((b) => b.dataset.nvReact))];
    keys.forEach(async (key) => {
      paint(key);
      try {
        const add = await get(key, false);
        // Undo counters can only be non-zero where there were clicks; skip the rest to stay under the rate limit.
        counts[key] = { add, undo: add ? await get(key, true) : 0 };
        paint(key);
      } catch {}
    });

    // Picker: "+" opens every reaction; picking one, clicking outside or Esc closes it.
    const setOpen = (group, open) => {
      group.classList.toggle("is-open", open);
      group.querySelector("[data-nv-react-more]").setAttribute("aria-expanded", open);
    };
    document.querySelectorAll("[data-nv-react-more]").forEach((more) => {
      more.addEventListener("click", () => setOpen(more.parentElement, !more.parentElement.classList.contains("is-open")));
    });
    const closeAll = () => document.querySelectorAll(".nv-react.is-open").forEach((g) => setOpen(g, false));
    document.addEventListener("click", (e) => { if (!e.target.closest(".nv-react")) closeAll(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAll(); });

    const busy = new Set();
    document.querySelectorAll("[data-nv-react]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const key = btn.dataset.nvReact;
        closeAll();
        if (busy.has(key)) return;
        busy.add(key);
        const undo = reacted.has(key);
        const field = undo ? "undo" : "add";
        const toggle = (on) => { on ? reacted.add(key) : reacted.delete(key); save(); };
        toggle(!undo);
        if (counts[key]) counts[key][field]++;
        paint(key);
        try {
          const value = await hit(key, undo);
          if (counts[key]) counts[key][field] = value;
        } catch {
          // Not recorded (offline / rate-limited): put the button back.
          toggle(undo);
          if (counts[key]) counts[key][field]--;
        }
        paint(key);
        busy.delete(key);
      });
    });

    {{ with site.Params.giscus }}
    if (!document.querySelector("[data-nv-count]")) return;
    const term = location.pathname.length < 2 ? "index" : location.pathname.substring(1).replace(/\.\w+$/, "");
    const api = "https://giscus.app/api/discussions?" + new URLSearchParams({
      repo: {{ .repo }}, term, category: {{ .category }}, number: "0", strict: "true", last: "1",
    });
    const show = (comments) =>
      document.querySelectorAll('[data-nv-count="comments"]').forEach((el) => (el.textContent = comments));
    fetch(api)
      .then((r) => r.json())
      .then((d) => d.discussion
        ? show(d.discussion.totalCommentCount + d.discussion.totalReplyCount)
        : d.error === "Discussion not found" && show(0))
      .catch(() => {});
    {{ end }}
  })();
</script>
