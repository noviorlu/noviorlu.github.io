{{- /* Brand mark: three connected vertices — a mesh triangle that is also a small graph.
       Context: a short string that keeps the gradient id unique on the page. */ -}}
{{- $id := printf "nv-logo-g-%s" (. | default "a") -}}
<svg class="nv-logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="{{ $id }}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgb(var(--color-primary-500))" />
      <stop offset="1" stop-color="rgb(var(--color-secondary-500))" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#{{ $id }})" />
  <path d="M10 22 L16 9 L23 21 Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round" />
  <circle cx="10" cy="22" r="2.6" fill="#fff" />
  <circle cx="16" cy="9" r="2.6" fill="#fff" />
  <circle cx="23" cy="21" r="2.6" fill="#fff" />
</svg>
