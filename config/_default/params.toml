colorScheme = "noviorlu"          # assets/css/schemes/noviorlu.css
defaultAppearance = "light"
autoSwitchAppearance = true       # follow the OS setting; the header toggle overrides it per visitor
enableSearch = true
enableCodeCopy = true
mainSections = ["blog"]
disableImageOptimization = false
smartTOC = true
smartTOCHideUnfocusedChildren = false

[header]
  layout = "site"                 # layouts/partials/header/site.html

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true   # also enables the switcher inside Blowfish's mobile menu
  showScrollToTop = true

[homepage]
  # The home page is layouts/index.html (hero + featured projects + latest writing).
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "/blog/"

[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateUpdated = true
  showAuthor = true
  showAuthorBottom = true
  showHero = true
  heroStyle = "nv"                # layouts/partials/hero/nv.html: contained banner under the title
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = false
  showTaxonomies = true
  showAuthorsBadges = false
  showWordCount = true
  showSummary = true
  sharingLinks = ["x-twitter", "linkedin", "email"]

[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true
  showViews = false
  showLikes = false
  showTableOfContents = false
  showCards = false
  groupByYear = true
  cardView = false                # rows come from layouts/partials/article-link/simple.html
  cardViewScreenWidth = false

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  groupByYear = true
  cardView = false
  cardViewScreenWidth = false
